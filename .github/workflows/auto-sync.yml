name: Auto Sync Upstream

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sync'
        required: false
        type: string
  schedule:
    - cron: '0 19 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new version
        id: check
        run: |
          CURRENT=$(grep 'PKG_VERSION:=' openlist/Makefile | head -1 | sed 's/.*:=//')
          if [ -n "${{ inputs.version }}" ]; then
            LATEST="${{ inputs.version }}"
          else
            LATEST=$(curl -s https://api.github.com/repos/lzw981731/OpenList/releases | jq -r '.[0].tag_name' | sed 's/^v//')
          fi
          echo "Current: $CURRENT, Latest: $LATEST"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Update Makefile
        if: steps.check.outputs.updated == 'true'
        run: |
          VER=${{ steps.check.outputs.new_version }}
          SHA=$(curl -s https://api.github.com/repos/lzw981731/OpenList/git/ref/tags/v$VER | jq -r '.object.sha')
          HASH=$(curl -sL "https://codeload.github.com/lzw981731/OpenList/tar.gz/v$VER" | sha256sum | cut -d' ' -f1)
          FHASH=$(curl -sL "https://github.com/OpenListTeam/OpenList-Frontend/releases/download/v$VER/openlist-frontend-dist-lite-v$VER.tar.gz" | sha256sum | cut -d' ' -f1)
          
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=$VER/" openlist/Makefile
          sed -i "s/PKG_WEB_VERSION:=.*/PKG_WEB_VERSION:=$VER/" openlist/Makefile
          sed -i "s/PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$SHA/" openlist/Makefile
          sed -i "s/PKG_HASH:=.*/PKG_HASH:=$HASH/" openlist/Makefile
          sed -i "s/HASH:=.*/HASH:=$FHASH/" openlist/Makefile

      - name: Commit and tag
        if: steps.check.outputs.updated == 'true'
        run: |
          VER=${{ steps.check.outputs.new_version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openlist/Makefile
          git commit -m "chore: update OpenList to v$VER"
          git tag -a "v$VER" -m "Release v$VER"
          git push origin main "v$VER"
          gh release create "v$VER" --title "v$VER" --notes "Updated to v$VER" --verify-tag
