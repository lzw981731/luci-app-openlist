name: Build Packages

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: '0 2 * * 0'  # 每周日 UTC 02:00 (北京时间 10:00)
  workflow_dispatch:  # 允许手动触发

jobs:
  check-update:
    name: Check for Updates
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      upstream_version: ${{ steps.check.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check OpenList upstream commit
        id: check
        run: |
          # 获取当前 Makefile 中记录的上游 commit SHA
          CURRENT_SHA=$(grep 'PKG_SOURCE_VERSION:=' openlist/Makefile | head -1 | sed 's/.*:=//')
          echo "Current upstream SHA: $CURRENT_SHA"

          # 获取上游仓库最新 commit SHA
          UPSTREAM_SHA=$(curl -s https://api.github.com/repos/lzw981731/OpenList/commits/main | jq -r '.sha')
          echo "Latest upstream SHA: $UPSTREAM_SHA"

          # 比较 SHA
          if [ "$CURRENT_SHA" != "$UPSTREAM_SHA" ]; then
            echo "New upstream commit detected"
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "upstream_version=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          else
            echo "Already up to date"
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

  auto-release:
    name: Auto Release
    needs: check-update
    if: needs.check-update.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: version
        run: |
          # 获取当前最新的 tag
          CURRENT_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG="v1.0.0"
          fi
          echo "Current tag: $CURRENT_TAG"

          # 解析版本号并递增 patch 版本
          VERSION=${CURRENT_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update Makefile with new version
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          UPSTREAM_SHA=${{ needs.check-update.outputs.upstream_version }}

          echo "Updating to version $NEW_VERSION (SHA: $UPSTREAM_SHA)"

          # 获取上游 tarball hash
          TARBALL_URL="https://codeload.github.com/lzw981731/OpenList/tar.gz/v${NEW_VERSION}"
          echo "Tarball URL: $TARBALL_URL"

          # 下载并计算 hash
          curl -sL "$TARBALL_URL" -o /tmp/openlist.tar.gz
          NEW_HASH=$(sha256sum /tmp/openlist.tar.gz | cut -d' ' -f1)
          echo "New hash: $NEW_HASH"

          # 更新 Makefile
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=$NEW_VERSION/" openlist/Makefile
          sed -i "s/PKG_WEB_VERSION:=.*/PKG_WEB_VERSION:=$NEW_VERSION/" openlist/Makefile
          sed -i "s/PKG_HASH:=.*/PKG_HASH:=$NEW_HASH/" openlist/Makefile
          sed -i "s|PKG_SOURCE_URL:=.*|PKG_SOURCE_URL:=https://codeload.github.com/lzw981731/OpenList/tar.gz/v\$\(PKG_VERSION\)?" openlist/Makefile

          # 显示更新后的 Makefile
          grep -E 'PKG_VERSION|PKG_HASH|PKG_SOURCE_URL' openlist/Makefile

      - name: Create tag and release
        run: |
          NEW_TAG=${{ steps.version.outputs.new_tag }}
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          UPSTREAM_SHA=${{ needs.check-update.outputs.upstream_version }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 提交更改
          git add openlist/Makefile
          git commit -m "chore: update OpenList to v$NEW_VERSION ($UPSTREAM_SHA)"

          # 创建 tag
          git tag -a "$NEW_TAG" -m "Release $NEW_VERSION"
          git push origin main
          git push origin "$NEW_TAG"

          echo "Created tag: $NEW_TAG"

  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    needs: auto-release
    if: github.event_name == 'push' || needs.auto-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a7_vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - loongarch64_generic
          - mips64_mips64r2
          - mips64_octeonplus
          - mips64el_mips64r2
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - riscv64_riscv64
          - x86_64
        sdk:
          - openwrt-24.10
          - SNAPSHOT

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-release.outputs.new_tag || github.ref_name }}
          fetch-depth: 0

      - name: Build with Static Linking
        run: |
          sed -i '/golang-package/a \\tGO_PKG_DEFAULT_LDFLAGS:=-w -s -extldflags "-static"' openlist/Makefile

      - name: UPX Compress
        if: ${{ matrix.arch != 'loongarch64_generic' && matrix.arch != 'mips64_mips64r2' && matrix.arch != 'mips64_octeonplus' && matrix.arch != 'mips64el_mips64r2' && matrix.arch != 'riscv64_riscv64' }}
        run: |
          sed -i '/openlist.init/a \\t/usr/bin/upx --lzma --best $(1)\/usr\/bin\/openlist' openlist/Makefile

      - name: Build Packages
        uses: sbwml/openwrt-gh-action-sdk@go1.25
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-openlistui
          NO_REFRESH_CHECK: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: |
            bin/packages/${{ matrix.arch }}/packages_ci/*.apk
            bin/packages/riscv64_generic/packages_ci/*.apk
            bin/packages/${{ matrix.arch }}/packages_ci/*.ipk

      - name: Create compress files
        continue-on-error: true
        run: |
          if [ "${{ matrix.arch }}" = "riscv64_riscv64" ] && [ "${{ matrix.sdk }}" = "SNAPSHOT" ]; then
            tar -zcvf ${{ matrix.sdk }}-${{ matrix.arch }}.tar.gz -C bin/packages/riscv64_generic/ packages_ci
          else
            tar -zcvf ${{ matrix.sdk }}-${{ matrix.arch }}.tar.gz -C bin/packages/${{ matrix.arch }}/ packages_ci
          fi

      - name: Upload packages
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.auto-release.outputs.new_tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: "${{ matrix.sdk }}-${{ matrix.arch }}.tar.gz"
